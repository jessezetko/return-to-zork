name: rtz

services:
  db:
    image: neo4j:latest
    container_name: rtz-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports:
      - '${NEO4J_WEB_PORT:-7474}:7474'
      - '${NEO4J_BOLT_PORT:-7687}:7687'
    volumes:
      - ./data:/data

  turns:
    image: kurrentplatform/kurrentdb:latest
    container_name: rtz-kurrentdb
    environment:
      KURRENTDB_INSECURE: 'true'
    ports:
      - '${KURRENTDB_PORT:-2113}:2113'
    volumes:
      - turns:/var/lib/kurrentdb

  api:
    build:
      context: ./api
    container_name: rtz-api
    environment:
      PORT: ${API_PORT:-3000}
      NEO4J_URI: bolt://db:${NEO4J_BOLT_PORT:-7687}
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      KURRENTDB_URI: kurrentdb://turns:${KURRENTDB_PORT:-2113}?tls=false
      WORLD_DIR: /worlds
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      - ./api:/app
      - /app/node_modules
      - ./worlds:/worlds:ro
    depends_on:
      - db
      - turns

  web:
    build:
      context: ./web
    container_name: rtz-web
    environment:
      VITE_PORT: ${WEB_PORT:-5173}
      VITE_API_PROXY_TARGET: http://api:${API_PORT:-3000}
    ports:
      - '${WEB_PORT:-5173}:5173'
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  turns:
